packages:
  - "apps/*"
  - "packages/*"
  - "scripts"

allowBuilds:
  esbuild: true
  sharp: true
  workerd: true

minimumReleaseAgeExclude:
  - "@alchemy.run/*"
  - "@distilled.cloud/*"
  - alchemy

catalog:
  "@base-ui/react": "^1.9.0"
  "@cloudflare/workers-types": "^5.20261019.1"
  "@distilled.cloud/cloudflare": "1.0.0-rc.13"
  "@effect/platform-node": "^4.0.5"
  "@fontsource-variable/figtree": "^5.3.0"
  "@fontsource-variable/jetbrains-mono": "^5.3.0"
  "@fontsource-variable/plus-jakarta-sans": "^5.3.0"
  "@phosphor-icons/react": "^2.1.10"
  "@tailwindcss/vite": "^4.3.3"
  "@tanstack/highlight": "^0.0.10"
  "@tanstack/markdown": "^0.0.13"
  "@tanstack/react-form": "^1.33.5"
  "@tanstack/react-query": "^5.104.5"
  "@tanstack/react-router": "^1.170.45"
  "@tanstack/react-router-ssr-query": "^1.167.3"
  "@tanstack/react-start": "^1.169.3"
  "@types/mdx": "^2.0.14"
  "@types/node": "^26.6.5"
  "@types/react": "^19.3.0"
  "@types/react-dom": "^19.3.0"
  "@vitejs/plugin-react": "^6.1.2"
  alchemy: "^2.0.0-beta.83"
  class-variance-authority: "^0.7.1"
  clsx: "^2.1.1"
  cmdk: "^1.1.1"
  date-fns: "^4.4.0"
  drizzle-kit: "1.0.0-rc.5-ab785fc"
  drizzle-orm: "1.0.0-rc.5-ab785fc"
  effect: "^4.0.5"
  embla-carousel-react: "^8.6.0"
  fumadocs-core: "^16.17.7"
  fumadocs-mdx: "^15.4.9"
  input-otp: "^1.5.0"
  jose: "^6.2.13"
  mrmime: "^2.0.1"
  oxc-transform-react: "^0.145.0"
  react: "^19.3.1"
  react-day-picker: "^10.0.2"
  react-dom: "^19.3.1"
  react-resizable-panels: "^4.14.7"
  recharts: "3.8.0"
  rehype-autolink-headings: "^7.1.0"
  rehype-external-links: "^3.0.0"
  sonner: "^2.0.8"
  tailwind-merge: "^3.7.0"
  tailwindcss: "^4.3.3"
  takumi-js: "^2.17.1"
  tsx: "^4.23.15"
  tw-animate-css: "^1.4.0"
  typescript: "^7.0.2"
  vite: npm:@voidzero-dev/vite-plus-core@1.3.0
  vite-plus: 1.3.0

catalogMode: "prefer"
catalogPrune: true

overrides:
  "hono": "^4.13.13"
  "@hono/node-server": "2.0.12"
  "lodash": "4.18.1"
  "capnp-es>typescript": "^7.0.2"
  vite@*: "catalog:"

blockExoticSubdeps: false

# drizzle-kit's api-* modules import drizzle-orm without declaring it; make it a peer so pnpm links it alongside
packageExtensions:
  drizzle-kit:
    peerDependencies:
      drizzle-orm: "*"

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
