packages:
  - "apps/*"
  - "packages/*"
  - "scripts"

allowBuilds:
  esbuild: true
  sharp: true
  workerd: true

minimumReleaseAgeExclude:
  - "@alchemy.run/*"
  - "@distilled.cloud/*"
  - alchemy

catalog:
  "@base-ui/react": "^1.9.0"
  "@cloudflare/workers-types": "^5.20261019.1"
  "@distilled.cloud/cloudflare": "1.0.0-rc.15"
  "@effect/platform-node": "^4.0.5"
  "@fontsource-variable/figtree": "^5.3.0"
  "@fontsource-variable/jetbrains-mono": "^5.3.0"
  "@fontsource-variable/plus-jakarta-sans": "^5.3.0"
  "@phosphor-icons/react": "^2.1.10"
  "@tailwindcss/vite": "^4.3.3"
  "@tanstack/highlight": "^0.0.10"
  "@tanstack/markdown": "^0.0.13"
  "@tanstack/react-form": "^1.33.5"
  "@tanstack/react-query": "^5.104.5"
  "@tanstack/react-router": "^1.170.45"
  "@tanstack/react-router-ssr-query": "^1.167.3"
  "@tanstack/react-start": "^1.169.3"
  "@types/mdx": "^2.0.14"
  "@types/node": "^26.6.5"
  "@types/react": "^19.3.0"
  "@types/react-dom": "^19.3.0"
  "@vitejs/plugin-react": "^6.1.2"
  alchemy: "^2.0.0-beta.83"
  class-variance-authority: "^0.7.1"
  clsx: "^2.1.1"
  drizzle-kit: "1.0.0-rc.5-ab785fc"
  drizzle-orm: "1.0.0-rc.5-ab785fc"
  effect: "^4.0.5"
  fumadocs-core: "^16.17.7"
  fumadocs-mdx: "^15.4.9"
  input-otp: "^1.5.0"
  jose: "^6.2.13"
  mrmime: "^2.0.1"
  oxc-transform-react: "^0.152.0"
  react: "^19.3.1"
  react-dom: "^19.3.1"
  rehype-autolink-headings: "^7.1.0"
  rehype-external-links: "^3.0.0"
  tailwind-merge: "^3.7.0"
  tailwindcss: "^4.3.3"
  takumi-js: "^2.17.1"
  tsx: "^4.23.15"
  tw-animate-css: "^1.4.0"
  typescript: "^7.0.2"
  vite: npm:@voidzero-dev/vite-plus-core@1.3.0
  vite-plus: 1.3.0

catalogMode: "prefer"
catalogPrune: true

overrides:
  # @prisma/dev (via alchemy) pins hono 4.11.4 and @hono/node-server 1.19.9, both with published advisories
  "hono": "^4.13.13"
  "@hono/node-server": "2.0.12"
  # chevrotain (via @prisma/dev) pins lodash 4.17.21, which has code injection and prototype pollution advisories
  "lodash": "4.18.1"
  # capnp-es only declares typescript ^5 || ^6 as an optional peer; reuse the workspace's TypeScript 7
  "capnp-es>typescript": "^7.0.2"
  # every vite in the graph is vite-plus-core; overrides do not reach auto-installed peers, so packages that
  # depend on alchemy (optional vite peer) also declare vite, or pnpm installs a second, real vite + rolldown
  vite: "catalog:"

blockExoticSubdeps: false

# drizzle-kit's api-* modules import drizzle-orm without declaring it; make it a peer so pnpm links it alongside
packageExtensions:
  drizzle-kit:
    peerDependencies:
      drizzle-orm: "*"

# vite-plus-core is versioned 1.x, outside the vite ^7 || ^8 range plugins declare
peerDependencyRules:
  allowAny:
    - vite
