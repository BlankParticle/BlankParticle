packages:
  - "apps/*"
  - "fleet"
  - "packages/*"
  - "scripts"

allowBuilds:
  esbuild: true
  msgpackr-extract: true
  sharp: true
  workerd: true

minimumReleaseAgeExclude:
  - "@alchemy.run/*"
  - "@distilled.cloud/*"
  - alchemy

catalog:
  "@base-ui/react": "^1.7.0"
  "@cloudflare/workers-types": "^5.20260829.1"
  "@distilled.cloud/cloudflare": "https://pkg.ing/@distilled.cloud/cloudflare/16f26a1"
  "@effect/platform-node": "4.0.0-rc.112"
  "@fontsource-variable/figtree": "^5.3.0"
  "@fontsource-variable/jetbrains-mono": "^5.3.0"
  "@fontsource-variable/plus-jakarta-sans": "^5.3.0"
  "@phosphor-icons/react": "^2.1.10"
  "@tailwindcss/vite": "^4.3.3"
  "@tanstack/highlight": "^0.0.10"
  "@tanstack/markdown": "^0.0.13"
  "@tanstack/react-form": "^1.33.5"
  "@tanstack/react-query": "^5.102.8"
  "@tanstack/react-router": "^1.170.32"
  "@tanstack/react-router-ssr-query": "^1.167.2"
  "@tanstack/react-start": "^1.168.49"
  "@types/mdx": "^2.0.14"
  "@types/node": "^26.4.0"
  "@types/react": "^19.2.18"
  "@types/react-dom": "^19.2.5"
  "@vitejs/plugin-react": "^6.1.1"
  alchemy: "https://pkg.ing/alchemy/73d16e5"
  class-variance-authority: "^0.7.1"
  clsx: "^2.1.1"
  cmdk: "^1.1.1"
  date-fns: "^4.4.0"
  drizzle-kit: "1.0.0-rc.5-ab785fc"
  drizzle-orm: "1.0.0-rc.5-ab785fc"
  effect: "4.0.0-rc.112"
  embla-carousel-react: "^8.6.0"
  fumadocs-core: "^16.15.4"
  fumadocs-mdx: "^15.4.0"
  input-otp: "^1.5.0"
  jose: "^6.2.10"
  mrmime: "^2.0.1"
  oxc-transform-react: "^0.145.0"
  react: "^19.2.8"
  react-day-picker: "^10.0.1"
  react-dom: "^19.2.8"
  react-resizable-panels: "^4.12.3"
  recharts: "3.8.0"
  rehype-autolink-headings: "^7.1.0"
  rehype-external-links: "^3.0.0"
  sonner: "^2.0.8"
  tailwind-merge: "^3.6.0"
  tailwindcss: "^4.3.3"
  takumi-js: "^2.13.2"
  tsx: "^4.23.12"
  tw-animate-css: "^1.4.0"
  typescript: "^7.0.2"
  vite: "^8.2.2"
  vite-plus: "^0.3.0"

catalogMode: "prefer"
catalogPrune: true

overrides:
  "hono": "^4.13.5"
  "@hono/node-server": "2.0.12"
  "lodash": "4.18.1"
  "capnp-es>typescript": "^7.0.2"

blockExoticSubdeps: false

# drizzle-kit's api-* modules import drizzle-orm without declaring it; make it a peer so pnpm links it alongside
packageExtensions:
  drizzle-kit:
    peerDependencies:
      drizzle-orm: "*"
