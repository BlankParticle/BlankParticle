packages:
  - "apps/*"
  - "fleet"
  - "packages/*"
  - "scripts"

allowBuilds:
  esbuild: true
  msgpackr-extract: true
  sharp: true
  workerd: true

minimumReleaseAgeExclude:
  - "@alchemy.run/*"
  - "@distilled.cloud/*"
  - alchemy
  - drizzle-orm
  - drizzle-kit

overrides:
  "hono": "^4.13.5"
  "@hono/node-server": "2.0.12"
  "lodash": "4.18.1"

blockExoticSubdeps: false

# drizzle-kit's api-* modules import drizzle-orm without declaring it; make it a peer so pnpm links it alongside
packageExtensions:
  drizzle-kit:
    peerDependencies:
      drizzle-orm: "*"
